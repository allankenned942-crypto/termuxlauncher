plugins {
    id 'com.android.application'
}

android {
    namespace 'amsitlab.android.apps.termuxlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "amsitlab.android.apps.termuxlauncher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
